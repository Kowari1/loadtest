apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.3
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: kafka-jmx:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 9092
            - containerPort: 7071

          env:
            - name: KAFKA_OPTS
              value: "-javaagent:/opt/jmx/jmx_prometheus_javaagent-1.6.0.jar=7071:/opt/jmx/kafka.yml"

            - name: KAFKA_BROKER_ID
              value: "1"

            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092

    - name: jmx
      port: 7071
      targetPort: 7071
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-topic
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-create-topic
          image: confluentinc/cp-kafka:7.5.3
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka..."

              until kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1
              do
                echo "Kafka is not ready yet..."
                sleep 2
              done

              echo "Kafka is ready"

              kafka-topics --create \
                --if-not-exists \
                --topic test-topic \
                --bootstrap-server kafka:9092 \
                --partitions 1 \
                --replication-factor 1

              echo "Topics:"
              kafka-topics --bootstrap-server kafka:9092 --list